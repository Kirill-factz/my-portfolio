<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- Градиентный фон -->
    <defs>
        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e2d1ccff" /> <!-- Оранжевый -->
            <stop offset="100%" stop-color="#0f0f10ff" /> <!-- Синий -->
        </linearGradient>
    </defs>
    
    <!-- Фон (круг) -->
    <circle cx="50" cy="50" r="45" fill="url(#gradient)" />
    
    <!-- Буква K -->
    <text 
        x="50" 
        y="65" 
        font-size="45" 
        text-anchor="middle" 
        fill="white" 
        font-family="Arial, sans-serif" 
        font-weight="bold"
    >
        K
    </text>
</svg>